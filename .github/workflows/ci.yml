name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v3

      - name: Python 3.12 고정
        run: uv python install 3.12

      - name: 의존성 설치
        run: uv sync --frozen

      - name: 테스트 실행 (slow 마커 제외, 기존 미해결 이슈 2건 제외)
        run: uv run pytest -m "not slow" --ignore=tests/custom_transformer/test_full_pipeline.py --ignore=tests/rag_pipeline/test_vector_store.py

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 및 push
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY_URI }}:latest .
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: EC2 SSH 접속 및 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PRUNE_THRESHOLD
          script: |
            set -e
            cd ~/07_scheduling_ai_chatbot
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 668425684373.dkr.ecr.ap-northeast-2.amazonaws.com
            docker image prune -af --filter "until=${PRUNE_THRESHOLD}"
            docker compose pull
            docker compose up -d
        env:
          PRUNE_THRESHOLD: ${{ vars.IMAGE_PRUNE_THRESHOLD }}
