name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v3

      - name: Python 3.12 고정
        run: uv python install 3.12

      - name: 의존성 설치
        run: uv sync --frozen

      - name: 테스트 실행 (slow 마커 제외)
        run: uv run pytest -m "not slow"
